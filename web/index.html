<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AH: Hell Aisle — claude</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd;
    font-family: ui-monospace, Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; }
  .frame { position: relative; width: min(1280px, 100vw); aspect-ratio: 16 / 9; }
  canvas { width: 100%; height: 100%; display: block; max-width: 100%;
    image-rendering: pixelated; background: #000; }
  #start { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; background: rgba(0, 0, 0, 0.85); cursor: pointer;
    font-size: 1.4rem; letter-spacing: 0.05em; user-select: none; }
  .hint { font-size: 0.85rem; color: #888; }
</style>
</head>
<body>
  <div class="frame">
    <canvas id="canvas" width="1280" height="720" tabindex="0"></canvas>
    <div id="start">&#9654; click to start</div>
  </div>
  <p class="hint">Esc releases the mouse &mdash; Esc again returns to the title screen.</p>
  <script>
  (function () {
    var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    var frame = document.querySelector('.frame');
    var ready = false;

    // Every injected input goes through the web_input shim's exported setters.
    // Guarded: touches can arrive while the wasm runtime is still loading.
    function W(name) {
      if (!ready) return;
      var fn = window.Module && Module['_' + name];
      if (fn) fn.apply(null, Array.prototype.slice.call(arguments, 1));
    }

    document.getElementById('start').addEventListener('click', function () {
      this.remove();
      var canvas = document.getElementById('canvas');
      window.Module = {
        canvas: canvas,
        onRuntimeInitialized: function () { ready = true; }
      };
      var engine = document.createElement('script');
      engine.src = 'game.js';
      document.body.appendChild(engine);
      canvas.focus();
      // Must happen inside this click: iOS only grants motion permission,
      // fullscreen and orientation lock from a user gesture.
      if (isTouch) initMobile();
    }, { once: true });

    if (!isTouch) return;   // desktop: nothing below runs, no DOM changes

    // ---- mobile touch layer -------------------------------------------------

    var STICK_CLAMP = 64, STICK_DEAD = 8, STICK_FULL = 48;   // CSS px
    var HOLD_MS = 100, MOVE_PX = 12, SWIPE_MS = 350, SWIPE_PX = 48;
    var LOOK_SENS = 0.0045;                                  // rad per px, drag-look
    var DEG = Math.PI / 180;
    var TILT_DEAD = 3 * DEG, TILT_FULL = 25 * DEG, TURN_MAX = 150 * DEG;

    var touches = {};        // touch identifier -> record
    var stickId = null;      // identifier owning the virtual stick
    var stickBase, stickNub, hintEl;
    var motionActive = false;   // a sensor (or __mob) is feeding gravity
    var ema = null, g0 = null, calib = { x: 0, y: 0, n: 0 }, lastMotion = 0;
    var lastTilt = 0, lastRate = 0, lastStick = { x: 0, y: 0 };

    document.getElementById('start').innerHTML = '&#9654; tap to start';
    document.querySelector('.hint').textContent =
      'tilt to steer · left thumb moves · tap fires · swipe switches weapon';

    var css = document.createElement('style');
    css.textContent =
      '.frame{touch-action:none;-webkit-user-select:none;user-select:none}' +
      '.stick{position:absolute;border-radius:50%;pointer-events:none;display:none;z-index:3}' +
      '#stick-base{width:96px;height:96px;margin:-48px 0 0 -48px;' +
        'border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08)}' +
      '#stick-nub{width:40px;height:40px;margin:-20px 0 0 -20px;background:rgba(255,255,255,.3)}' +
      '#mob-hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);' +
        'font-size:.75rem;color:#ccc;background:rgba(0,0,0,.55);padding:2px 10px;' +
        'border-radius:4px;display:none;pointer-events:none;z-index:3}';
    document.head.appendChild(css);

    function initMobile() {
      stickBase = document.createElement('div');
      stickBase.className = 'stick'; stickBase.id = 'stick-base';
      stickNub = document.createElement('div');
      stickNub.className = 'stick'; stickNub.id = 'stick-nub';
      hintEl = document.createElement('div');
      hintEl.id = 'mob-hint';
      hintEl.textContent = 'motion aim off — drag to look';
      frame.appendChild(stickBase);
      frame.appendChild(stickNub);
      frame.appendChild(hintEl);

      startMotion();
      try {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(function () {});
        }
      } catch (e) {}
      try {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(function () {});
        }
      } catch (e) {}

      frame.addEventListener('touchstart', onTouchStart, { passive: false });
      frame.addEventListener('touchmove', onTouchMove, { passive: false });
      frame.addEventListener('touchend', onTouchEnd, { passive: false });
      frame.addEventListener('touchcancel', onTouchCancel, { passive: false });
    }

    // ---- virtual stick (left half) ----

    function placeStick(bx, by, nx, ny) {
      stickBase.style.display = stickNub.style.display = 'block';
      var rect = frame.getBoundingClientRect();
      stickBase.style.left = (bx - rect.left) + 'px';
      stickBase.style.top = (by - rect.top) + 'px';
      stickNub.style.left = (nx - rect.left) + 'px';
      stickNub.style.top = (ny - rect.top) + 'px';
    }

    function sendMove(x, y) {
      lastStick.x = x; lastStick.y = y;
      W('web_set_move', x, y);
    }

    function startStick(id, cx, cy) {
      if (stickId !== null) { touches[id] = { kind: 'dead' }; return; }
      stickId = id;
      touches[id] = { kind: 'stick', bx: cx, by: cy };
      placeStick(cx, cy, cx, cy);
      sendMove(0, 0);
    }

    function moveStick(rec, cx, cy) {
      var dx = cx - rec.bx, dy = cy - rec.by;
      var len = Math.hypot(dx, dy);
      var vis = Math.min(len, STICK_CLAMP);
      var ux = len > 0 ? dx / len : 0, uy = len > 0 ? dy / len : 0;
      placeStick(rec.bx, rec.by, rec.bx + ux * vis, rec.by + uy * vis);
      if (len <= STICK_DEAD) { sendMove(0, 0); return; }
      var sx = dx / STICK_FULL, sy = -dy / STICK_FULL;   // screen-up = forward
      var sLen = Math.hypot(sx, sy);
      if (sLen > 1) { sx /= sLen; sy /= sLen; }
      sendMove(sx, sy);
    }

    function endStick() {
      stickId = null;
      stickBase.style.display = stickNub.style.display = 'none';
      sendMove(0, 0);
    }

    // ---- tap / hold / swipe (right half) ----

    function startAction(id, cx, cy) {
      var rec = { kind: 'action', state: 'PENDING',
                  t0: performance.now(), x0: cx, y0: cy, x: cx, y: cy, timer: 0 };
      rec.timer = setTimeout(function () {
        if (rec.state === 'PENDING') {
          rec.state = 'FIRING';           // held: autofire until the finger lifts
          W('web_set_fire', 1);
          W('web_press_use');
        }
      }, HOLD_MS);
      touches[id] = rec;
    }

    function moveAction(rec, cx, cy) {
      var px = rec.x;
      rec.x = cx; rec.y = cy;
      if (rec.state === 'PENDING' &&
          Math.hypot(cx - rec.x0, cy - rec.y0) > MOVE_PX) {
        clearTimeout(rec.timer);
        // With motion aim the drag is a weapon swipe; without it, it looks around.
        rec.state = motionActive ? 'SWIPE' : 'LOOK';
      }
      if (rec.state === 'LOOK') W('web_add_yaw', (cx - px) * LOOK_SENS);
    }

    function endAction(rec) {
      clearTimeout(rec.timer);
      if (rec.state === 'FIRING') {
        W('web_set_fire', 0);
      } else if (rec.state === 'PENDING') {
        W('web_set_fire', 1);   // the firePressed edge lands exactly one shot
        W('web_set_fire', 0);
        W('web_press_use');
      } else {   // SWIPE, or LOOK (a fast drag still counts as a swipe)
        var dur = performance.now() - rec.t0;
        var dx = rec.x - rec.x0, dy = rec.y - rec.y0;
        if (dur <= SWIPE_MS && Math.abs(dx) >= SWIPE_PX &&
            Math.abs(dx) >= 2 * Math.abs(dy)) {
          W('web_cycle_weapon', dx > 0 ? 1 : -1);   // swipe right = next
        }
      }
    }

    // ---- touch routing ----

    function onTouchStart(e) {
      e.preventDefault();
      W('web_set_touch_mode', 1);   // idempotent; survives pre-runtime touches
      var rect = frame.getBoundingClientRect();
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        if (t.clientX - rect.left < rect.width / 2) {
          startStick(t.identifier, t.clientX, t.clientY);
        } else {
          startAction(t.identifier, t.clientX, t.clientY);
        }
      }
    }

    function onTouchMove(e) {
      e.preventDefault();
      for (var i = 0; i < e.changedTouches.length; i++) {
        var t = e.changedTouches[i];
        var rec = touches[t.identifier];
        if (!rec) continue;
        if (rec.kind === 'stick') moveStick(rec, t.clientX, t.clientY);
        else if (rec.kind === 'action') moveAction(rec, t.clientX, t.clientY);
      }
    }

    function onTouchEnd(e) {
      e.preventDefault();
      for (var i = 0; i < e.changedTouches.length; i++) {
        var id = e.changedTouches[i].identifier;
        var rec = touches[id];
        if (!rec) continue;
        if (rec.kind === 'stick') endStick();
        else if (rec.kind === 'action') endAction(rec);
        delete touches[id];
      }
    }

    function onTouchCancel(e) {
      e.preventDefault();
      for (var i = 0; i < e.changedTouches.length; i++) {
        var id = e.changedTouches[i].identifier;
        var rec = touches[id];
        if (!rec) continue;
        if (rec.kind === 'stick') endStick();
        else if (rec.kind === 'action') {   // cancelled touches never tap-fire
          clearTimeout(rec.timer);
          if (rec.state === 'FIRING') W('web_set_fire', 0);
        }
        delete touches[id];
      }
    }

    // ---- accelerometer aim: steering-wheel roll -> turn rate ----

    // Gravity, not Euler angles: deviceorientation gimbal-locks near landscape.
    // g0 is captured at start (and re-captured on rotation); the signed screen-roll
    // angle between g0 and the smoothed g is sign-convention-proof — a global
    // negation of the vector cancels in the products.
    function feedGravity(x, y, z) {
      lastMotion = performance.now();
      if (!motionActive) {
        motionActive = true;
        if (hintEl) hintEl.style.display = 'none';
      }
      if (!ema) ema = { x: x, y: y, z: z };
      else {
        ema.x += 0.25 * (x - ema.x);
        ema.y += 0.25 * (y - ema.y);
        ema.z += 0.25 * (z - ema.z);
      }
      if (calib) {
        calib.x += ema.x; calib.y += ema.y; calib.n++;
        if (calib.n >= 20) { g0 = { x: calib.x / calib.n, y: calib.y / calib.n }; calib = null; }
        W('web_set_turn_rate', 0);
        return;
      }
      var tilt = Math.atan2(g0.x * ema.y - g0.y * ema.x, g0.x * ema.x + g0.y * ema.y);
      var mag = Math.min(1, Math.max(0, (Math.abs(tilt) - TILT_DEAD) / (TILT_FULL - TILT_DEAD)));
      var sign = (screen.orientation && screen.orientation.angle === 270) ? -1 : 1;
      lastTilt = tilt;
      lastRate = Math.sign(tilt) * mag * TURN_MAX * sign;
      W('web_set_turn_rate', lastRate);
    }

    function motionOff() {
      if (motionActive) return;
      if (hintEl) hintEl.style.display = 'block';
    }

    function startMotion() {
      if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission().then(function (s) {
          if (s === 'granted') listenMotion(); else motionOff();
        }).catch(motionOff);
      } else if (window.DeviceMotionEvent) {
        listenMotion();
      } else {
        motionOff();
      }
      window.addEventListener('orientationchange', function () {
        ema = null; g0 = null; calib = { x: 0, y: 0, n: 0 };
        W('web_set_turn_rate', 0);
      });
      // Watchdog: a silent sensor must not leave the view spinning.
      setInterval(function () {
        if (motionActive && performance.now() - lastMotion > 500) {
          W('web_set_turn_rate', 0);
        }
      }, 250);
      // API present but mute (desktop emulation, some Androids): fall back.
      setTimeout(function () { if (!motionActive) motionOff(); }, 1500);
    }

    function listenMotion() {
      window.addEventListener('devicemotion', function (e) {
        var g = e.accelerationIncludingGravity;
        if (g && g.x != null) feedGravity(g.x, g.y, g.z || 0);
      });
    }

    // Desktop test seams: feed the gravity pipeline by hand, read the state back.
    window.__mob = {
      setGravity: function (x, y, z) { feedGravity(x, y, z || 0); },
      state: function () {
        return { ready: ready, motion: motionActive,
                 tiltDeg: lastTilt / DEG, rateDegPerSec: lastRate / DEG,
                 stickX: lastStick.x, stickY: lastStick.y };
      }
    };
  })();
  </script>
</body>
</html>
